name: Python Dashboard CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'projects/vitalsense-dashboard/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'projects/vitalsense-dashboard/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-webkit2-4.1

      - name: Create virtual environment
        run: |
          cd projects/vitalsense-dashboard
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip

      - name: Lint Python code
        run: |
          cd projects/vitalsense-dashboard
          source venv/bin/activate
          pip install flake8 pylint
          flake8 --exclude=venv,backend/venv .
          pylint --ignore=venv,backend/venv app.py backend/ core/

      - name: Check config.json
        run: |
          cd projects/vitalsense-dashboard
          python3 -c "import json; json.load(open('config.json')); print('config.json is valid JSON')"

      - name: Verify frontend structure
        run: |
          cd projects/vitalsense-dashboard
          test -f frontend/index.html && echo "index.html exists"
          test -f frontend/app.jsx && echo "app.jsx exists"